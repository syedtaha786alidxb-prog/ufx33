<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Logs — Harbor Desk</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="topnav" id="topnav"></div>
<div class="wrap">
  <div class="panel">
    <h2>Activity Log</h2>
    <p class="sub">User-wise and activity-wise trail of everything happening in the system (latest 300).</p>
    <table><thead><tr><th>When</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody id="activityRows"></tbody></table>
  </div>
  <div class="panel">
    <h2>Email Log</h2>
    <p class="sub">Every email the system has tried to send via the configured SMTP server — who sent it, to whom, and whether it succeeded.</p>
    <table><thead><tr><th>When</th><th>Sent By</th><th>To</th><th>Subject</th><th>Related</th><th>Status</th></tr></thead><tbody id="emailRows"></tbody></table>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
async function load() {
  const activity = await api("GET", "/api/activity-logs");
  document.getElementById("activityRows").innerHTML = activity.map(a => `
    <tr><td class="mono">${a.ts}</td><td>${a.username}</td><td><span class="badge badge-unsettled">${a.action}</span></td><td>${a.details||""}</td></tr>`).join("")
    || `<tr><td colspan="4"><div class="empty">No activity yet.</div></td></tr>`;

  const emails = await api("GET", "/api/email-logs");
  document.getElementById("emailRows").innerHTML = emails.map(e => `
    <tr><td class="mono">${e.ts}</td><td>${e.sent_by_username}</td><td>${e.to_email||"—"}</td><td>${e.subject||""}</td>
      <td>${e.related_type||""} ${e.related_ref||""}</td>
      <td><span class="badge ${e.status==='sent'?'badge-settled':'badge-unsettled'}" title="${e.error||''}">${e.status}</span></td></tr>`).join("")
    || `<tr><td colspan="6"><div class="empty">No emails sent yet.</div></td></tr>`;
}
(async function init() { await renderTopNav("admin/logs.html"); load(); })();
</script>
</body>
</html>
