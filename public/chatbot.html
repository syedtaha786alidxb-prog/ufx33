<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Chatbot — Harbor Desk</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .chat-wrap{max-width:820px;margin:24px auto;padding:0 20px;}
  .chat-panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;height:calc(100vh - 130px);min-height:480px;}
  .chat-head{padding:14px 20px;border-bottom:1px solid var(--line);}
  .chat-head h2{margin:0 0 2px 0;font-size:16px;}
  .chat-body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:82%;padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.5;}
  .msg.bot{background:#F1F4F7;color:var(--text);align-self:flex-start;border-bottom-left-radius:3px;}
  .msg.user{background:var(--violet);color:#fff;align-self:flex-end;border-bottom-right-radius:3px;}
  .msg table{margin-top:8px;font-size:12.5px;}
  .msg .kpi-mini{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 10px;margin:3px 6px 0 0;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:100%;}
  .chip{background:#fff;border:1px solid var(--violet);color:var(--violet);border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .chip:hover{background:var(--violet);color:#fff;}
  .chat-input-row{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);}
  .chat-input-row input{flex:1;}
  .typing{color:var(--text-mute);font-size:12.5px;font-style:italic;align-self:flex-start;}
</style>
</head>
<body>
<div class="topnav" id="topnav"></div>
<div class="chat-wrap">
  <div class="chat-panel">
    <div class="chat-head">
      <h2>🤖 Harbor Desk Assistant</h2>
      <p class="sub" style="margin:0;">Guided report assistant — pick an option or type a question (client name, vessel, port, "outstanding", etc). It answers using your real data, not a general AI — so it only knows what's in this system.</p>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input-row">
      <input id="chatInput" placeholder="Type here… e.g. 'ABC Traders outstanding' or 'JEBEL ALI jobs'">
      <button class="btn btn-violet" id="chatSend">Send</button>
      <button class="btn" id="chatMenuBtn">☰ Menu</button>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
let cache = { parties: null, vessels: null, ports: null, jobs: null };

function chatBody() { return document.getElementById("chatBody"); }
function scrollDown() { const b = chatBody(); b.scrollTop = b.scrollHeight; }

function addBot(html) {
  const d = document.createElement("div");
  d.className = "msg bot";
  d.innerHTML = html;
  chatBody().appendChild(d);
  scrollDown();
}
function addUser(text) {
  const d = document.createElement("div");
  d.className = "msg user";
  d.textContent = text;
  chatBody().appendChild(d);
  scrollDown();
}
function clearChips() {
  chatBody().querySelectorAll(".chips").forEach(c => c.remove());
}
function addChips(options) {
  clearChips();
  const row = document.createElement("div");
  row.className = "chips";
  options.forEach(([label, fn]) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = label;
    b.onclick = () => { clearChips(); addUser(label); fn(); };
    row.appendChild(b);
  });
  chatBody().appendChild(row);
  scrollDown();
}
async function withTyping(fn) {
  const t = document.createElement("div");
  t.className = "typing";
  t.textContent = "Assistant is checking the records…";
  chatBody().appendChild(t);
  scrollDown();
  try { await fn(); } finally { t.remove(); }
}

/* ---------------- data caches ---------------- */
async function getJobs() { if (!cache.jobs) cache.jobs = await api("GET", "/api/reports/job-list"); return cache.jobs; }
async function getParties() { if (!cache.parties) cache.parties = await api("GET", "/api/parties"); return cache.parties; }
async function getVessels() { if (!cache.vessels) cache.vessels = await api("GET", "/api/vessels"); return cache.vessels; }
async function getPorts() { if (!cache.ports) cache.ports = await api("GET", "/api/ports"); return cache.ports; }

function fmtn(n) { return (Math.round((n || 0) * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function jobsTable(jobs) {
  if (!jobs.length) return `<div class="sub">No jobs match this filter.</div>`;
  const totalInvoiced = jobs.reduce((s, j) => s + (j.invoice ? j.invoice.amount : 0), 0);
  const totalOutstanding = jobs.reduce((s, j) => s + (j.invoice ? (j.invoice.amount - j.invoice.settled_amount) : 0), 0);
  return `<div><span class="kpi-mini">Jobs: <b>${jobs.length}</b></span><span class="kpi-mini">Invoiced: <b>${fmtn(totalInvoiced)}</b></span><span class="kpi-mini">Outstanding: <b>${fmtn(totalOutstanding)}</b></span></div>
    <table><thead><tr><th>Job #</th><th>Client</th><th>Vessel/Voyage</th><th>POL→POD</th><th class="num">Invoice</th><th class="num">Outstanding</th></tr></thead>
    <tbody>${jobs.slice(0, 40).map(j => `<tr><td class="mono">${j.job_no}</td><td>${j.client || "—"}</td>
      <td>${j.vessel_name ? j.vessel_name + " / " + (j.voyage_no || "") : "—"}</td><td>${j.pol || "—"} → ${j.pod || "—"}</td>
      <td class="num mono">${j.invoice ? fmtn(j.invoice.amount) : "—"}</td>
      <td class="num mono">${j.invoice ? fmtn(j.invoice.amount - j.invoice.settled_amount) : "—"}</td></tr>`).join("")}</tbody></table>
    ${jobs.length > 40 ? `<div class="sub" style="margin-top:6px;">Showing first 40 of ${jobs.length}. See the full Reports page for the complete list.</div>` : ""}`;
}

/* ---------------- menu ---------------- */
function showMainMenu() {
  addBot(`👋 Hi! I can help you with Harbor Desk ERP — reports, outstanding balances, vessel/voyage and port-wise details. Pick an option below or just type your question.`);
  addChips([
    ["💰 Finance", showFinanceMenu],
    ["📦 Operations", showOpsMenu],
    ["🚢 Vessel / Voyage-wise", showVesselMenu],
    ["🌍 Port-wise", showPortMenu],
    ["👤 Client-wise", showClientMenu],
    ["📤 Import / Export (EDI)", showEdiSummary],
    ["🛠 Admin Snapshot", showAdminSnapshot],
  ]);
}

function backChip() { addChips([["⬅ Back to Menu", showMainMenu]]); }

function showFinanceMenu() {
  addBot(`💰 <b>Finance</b> — which report would you like?`);
  addChips([
    ["Outstanding by Vessel", () => withTyping(async () => {
      const rows = await api("GET", "/api/reports/outstanding-by-vessel");
      addBot(`<b>Outstanding by Vessel</b><table><thead><tr><th>Vessel</th><th class="num">AR Outstanding</th><th class="num">AP Outstanding</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td>${r.vessel}</td><td class="num mono">${fmtn(r.ar_outstanding)}</td><td class="num mono">${fmtn(r.ap_outstanding)}</td></tr>`).join("") || `<tr><td colspan="3">No data.</td></tr>`}</tbody></table>`);
      backChip();
    })],
    ["Receivables (AR)", () => withTyping(async () => {
      const rows = await api("GET", "/api/receivables");
      const out = rows.filter(r => (r.amount - r.settled_amount) > 0.005);
      addBot(`<b>Outstanding Receivables</b> — ${out.length} invoice(s)<table><thead><tr><th>Txn</th><th>Client</th><th class="num">Amount</th><th class="num">Received</th><th class="num">Balance</th></tr></thead>
        <tbody>${out.map(r => `<tr><td class="mono">${r.txn}</td><td>${r.client||"—"}</td><td class="num mono">${fmtn(r.amount)}</td><td class="num mono">${fmtn(r.settled_amount)}</td><td class="num mono">${fmtn(r.amount-r.settled_amount)}</td></tr>`).join("") || `<tr><td colspan="5">All receivables are settled 🎉</td></tr>`}</tbody></table>`);
      backChip();
    })],
    ["Payables (AP)", () => withTyping(async () => {
      const rows = await api("GET", "/api/payables");
      const out = rows.filter(r => (r.amount - r.settled_amount) > 0.005);
      addBot(`<b>Outstanding Payables</b> — ${out.length} bill(s)<table><thead><tr><th>Bill #</th><th>Vendor</th><th class="num">Amount</th><th class="num">Paid</th><th class="num">Balance</th></tr></thead>
        <tbody>${out.map(r => `<tr><td class="mono">${r.bill_no}</td><td>${r.vendor||"—"}</td><td class="num mono">${fmtn(r.amount)}</td><td class="num mono">${fmtn(r.settled_amount)}</td><td class="num mono">${fmtn(r.amount-r.settled_amount)}</td></tr>`).join("") || `<tr><td colspan="5">All payables are clear 🎉</td></tr>`}</tbody></table>`);
      backChip();
    })],
    ["Client Exposure", () => withTyping(async () => {
      const rows = await api("GET", "/api/reports/client-exposure");
      addBot(`<b>Client Exposure</b><table><thead><tr><th>Client</th><th class="num">Invoiced</th><th class="num">Received</th><th class="num">Exposure</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td>${r.client||"—"}</td><td class="num mono">${fmtn(r.invoiced)}</td><td class="num mono">${fmtn(r.received)}</td><td class="num mono">${fmtn(r.exposure)}</td></tr>`).join("") || `<tr><td colspan="4">No data.</td></tr>`}</tbody></table>`);
      backChip();
    })],
    ["Job Balancing", () => withTyping(async () => {
      const rows = await api("GET", "/api/reports/job-balancing");
      addBot(`<b>Job Balancing</b><table><thead><tr><th>Job #</th><th>Client</th><th class="num">AR Out.</th><th class="num">AP Out.</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td class="mono">${r.job_no}</td><td>${r.client||"—"}</td><td class="num mono">${fmtn(r.ar_outstanding)}</td><td class="num mono">${fmtn(r.ap_outstanding)}</td></tr>`).join("") || `<tr><td colspan="4">No data.</td></tr>`}</tbody></table>`);
      backChip();
    })],
    ["⬅ Menu", showMainMenu],
  ]);
}

function showOpsMenu() {
  addBot(`📦 <b>Operations</b> — which report would you like?`);
  addChips([
    ["Job List", () => withTyping(async () => { addBot(`<b>Job List</b>` + jobsTable(await getJobs())); backChip(); })],
    ["Job Containers", () => withTyping(async () => {
      const rows = await api("GET", "/api/reports/job-containers");
      addBot(`<b>Job Containers</b> — ${rows.length}<table><thead><tr><th>Job #</th><th>Container #</th><th>Seal</th><th>Size</th><th class="num">Wt</th></tr></thead>
        <tbody>${rows.slice(0,40).map(r=>`<tr><td class="mono">${r.job_no}</td><td class="mono">${r.no}</td><td>${r.seal||"—"}</td><td>${r.size}</td><td class="num mono">${fmtn(r.weight)}</td></tr>`).join("")||`<tr><td colspan="5">No data.</td></tr>`}</tbody></table>`);
      backChip();
    })],
    ["BL Release Status", () => withTyping(async () => {
      const rows = await api("GET", "/api/reports/bl-release-status");
      addBot(`<b>BL Release Status</b><table><thead><tr><th>Job #</th><th>Client</th><th>HBL</th><th>MBL</th><th>Status</th></tr></thead>
        <tbody>${rows.slice(0,40).map(r=>`<tr><td class="mono">${r.job_no}</td><td>${r.client||"—"}</td><td class="mono">${r.hbl||"—"}</td><td class="mono">${r.mbl||"—"}</td><td>${r.release_status||"—"}</td></tr>`).join("")||`<tr><td colspan="5">No data.</td></tr>`}</tbody></table>`);
      backChip();
    })],
    ["Job P&L", () => withTyping(async () => {
      const rows = await api("GET", "/api/reports/job-pl");
      addBot(`<b>Job Profit &amp; Loss</b><table><thead><tr><th>Job #</th><th>Client</th><th class="num">Revenue</th><th class="num">Cost</th><th class="num">Profit</th></tr></thead>
        <tbody>${rows.slice(0,40).map(r=>`<tr><td class="mono">${r.job_no}</td><td>${r.client||"—"}</td><td class="num mono">${fmtn(r.revenue)}</td><td class="num mono">${fmtn(r.cost)}</td><td class="num mono">${fmtn(r.profit)}</td></tr>`).join("")||`<tr><td colspan="5">No data.</td></tr>`}</tbody></table>`);
      backChip();
    })],
    ["Job Statistics", () => withTyping(async () => {
      const s = await api("GET", "/api/reports/job-statistics");
      addBot(`<b>Job Statistics</b><div>
        <span class="kpi-mini">Total Jobs: <b>${s.totalJobs}</b></span>
        <span class="kpi-mini">Approved: <b>${s.approvedJobs}</b></span>
        <span class="kpi-mini">Containers: <b>${s.totalContainers}</b></span>
        <span class="kpi-mini">Revenue: <b>${fmtn(s.totalRevenue)}</b></span>
        <span class="kpi-mini">Outstanding: <b>${fmtn(s.totalOutstanding)}</b></span>
        <span class="kpi-mini">Avg/Job: <b>${fmtn(s.avgRevenue)}</b></span></div>`);
      backChip();
    })],
    ["⬅ Menu", showMainMenu],
  ]);
}

async function showVesselMenu() {
  addBot(`🚢 Choose a vessel:`);
  await withTyping(async () => {
    const vessels = await getVessels();
    addChips([...vessels.map(v => [v.name, () => showVoyageMenu(v)]), ["⬅ Menu", showMainMenu]]);
  });
}
function showVoyageMenu(vessel) {
  addBot(`Choose a voyage (${vessel.name}):`);
  addChips([
    ["All Voyages", () => runVesselReport(vessel, null)],
    ...(vessel.voyages || []).map(voy => [`${voy.no}${voy.closed ? " (closed)" : ""}`, () => runVesselReport(vessel, voy)]),
    ["⬅ Menu", showMainMenu],
  ]);
}
async function runVesselReport(vessel, voyage) {
  await withTyping(async () => {
    const jobs = (await getJobs()).filter(j => j.vessel_id === vessel.id && (!voyage || j.voyage_id === voyage.id));
    addBot(`<b>${vessel.name}${voyage ? " / " + voyage.no : " — all voyages"}</b>` + jobsTable(jobs));
    backChip();
  });
}

async function showPortMenu() {
  addBot(`🌍 Port-wise report — POL (loading) or POD (discharge)?`);
  addChips([
    ["POL (Loading)", () => choosePort("pol")],
    ["POD (Discharge)", () => choosePort("pod")],
    ["⬅ Menu", showMainMenu],
  ]);
}
async function choosePort(field) {
  addBot(`Choose a port:`);
  await withTyping(async () => {
    const ports = await getPorts();
    addChips([...ports.slice(0, 30).map(p => [p.name, () => runPortReport(field, p.name)]), ["⬅ Menu", showMainMenu]]);
  });
}
async function runPortReport(field, portName) {
  await withTyping(async () => {
    const jobs = (await getJobs()).filter(j => (j[field] || "").toLowerCase() === portName.toLowerCase());
    addBot(`<b>${field.toUpperCase()}: ${portName}</b>` + jobsTable(jobs));
    backChip();
  });
}

async function showClientMenu() {
  addBot(`👤 Choose a client:`);
  await withTyping(async () => {
    const jobs = await getJobs();
    const names = [...new Set(jobs.map(j => j.client).filter(Boolean))];
    addChips([...names.slice(0, 30).map(n => [n, () => runClientReport(n)]), ["⬅ Menu", showMainMenu]]);
  });
}
async function runClientReport(name) {
  await withTyping(async () => {
    const jobs = (await getJobs()).filter(j => j.client === name);
    const exposureRows = await api("GET", "/api/reports/client-exposure");
    const exp = exposureRows.find(r => r.client === name);
    addBot(`<b>${name}</b>` +
      (exp ? `<div style="margin-bottom:6px;"><span class="kpi-mini">Invoiced: <b>${fmtn(exp.invoiced)}</b></span><span class="kpi-mini">Received: <b>${fmtn(exp.received)}</b></span><span class="kpi-mini">Outstanding: <b>${fmtn(exp.exposure)}</b></span></div>` : "") +
      jobsTable(jobs));
    backChip();
  });
}

function showEdiSummary() {
  addBot(`📤 <b>Import / Export (EDI)</b> — vessels/voyages whose manifest is ready for EDI:`);
  withTyping(async () => {
    const rows = await api("GET", "/api/edi/manifest-options");
    const jobs = await getJobs();
    addBot(`<table><thead><tr><th>Vessel</th><th>Voyage</th><th class="num">Jobs</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${r.vessel_name}</td><td>${r.voyage_no}</td><td class="num mono">${jobs.filter(j=>j.vessel_id===r.vessel_id&&j.voyage_id===r.voyage_id).length}</td></tr>`).join("") || `<tr><td colspan="3">No vessel/voyage is ready for EDI yet.</td></tr>`}</tbody></table>
      <div class="sub" style="margin-top:6px;">Use the Reports → EDI page to generate the full EDI file.</div>`);
    backChip();
  });
}

function showAdminSnapshot() {
  addBot(`🛠 <b>Admin Snapshot</b> — master data summary:`);
  withTyping(async () => {
    const [vessels, ports, parties] = await Promise.all([getVessels(), getPorts(), getParties()]);
    const voyageCount = vessels.reduce((s, v) => s + (v.voyages ? v.voyages.length : 0), 0);
    addBot(`<div>
      <span class="kpi-mini">Vessels: <b>${vessels.length}</b></span>
      <span class="kpi-mini">Voyages: <b>${voyageCount}</b></span>
      <span class="kpi-mini">Ports: <b>${ports.length}</b></span>
      <span class="kpi-mini">Customers/Vendors: <b>${parties.length}</b></span>
    </div>`);
    backChip();
  });
}

/* ---------------- free-text understanding (keyword-based, not full AI) ---------------- */
async function handleFreeText(text) {
  fetch("/api/chatbot/query-log", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) }).catch(() => {});
  const lower = text.toLowerCase().trim();
  await withTyping(async () => {
    const [jobs, parties, vessels, ports] = await Promise.all([getJobs(), getParties(), getVessels(), getPorts()]);

    const clientNames = [...new Set(jobs.map(j => j.client).filter(Boolean))];
    const vendorNames = [...new Set(parties.filter(p => p.is_vendor).map(p => p.name))];
    const client = clientNames.find(c => c && lower.includes(c.toLowerCase()));
    const vendor = vendorNames.find(v => v && lower.includes(v.toLowerCase()));
    const vessel = vessels.find(v => v.name && lower.includes(v.name.toLowerCase()));
    const port = ports.find(p => p.name && lower.includes(p.name.toLowerCase()));

    if (client) { addBot(`Got it — here's what I have on <b>${client}</b>:`); await runClientReport(client); return; }
    if (vendor && !client) {
      const bills = await api("GET", "/api/payables");
      const vendorBills = bills.filter(b => b.vendor && b.vendor.toLowerCase() === vendor.toLowerCase());
      const outstanding = vendorBills.filter(b => (b.amount - b.settled_amount) > 0.005);
      addBot(`<b>${vendor}</b> — ${vendorBills.length} bill(s), ${outstanding.length} outstanding<table><thead><tr><th>Bill #</th><th class="num">Amount</th><th class="num">Outstanding</th></tr></thead>
        <tbody>${vendorBills.slice(0,20).map(b=>`<tr><td class="mono">${b.bill_no}</td><td class="num mono">${fmtn(b.amount)}</td><td class="num mono">${fmtn(b.amount-b.settled_amount)}</td></tr>`).join("")||`<tr><td colspan="3">No bills yet.</td></tr>`}</tbody></table>`);
      backChip();
      return;
    }
    if (vessel) { addBot(`Got it — here's what I have on <b>${vessel.name}</b>:`); await runVesselReport(vessel, null); return; }
    if (port) {
      const field = lower.includes("discharge") || lower.includes("pod") ? "pod" : "pol";
      addBot(`Got it — here's what I have on port <b>${port.name}</b>:`);
      await runPortReport(field, port.name);
      return;
    }
    if (/outstanding|due|receivable/.test(lower)) {
      const rows = await api("GET", "/api/receivables");
      const out = rows.filter(r => (r.amount - r.settled_amount) > 0.005);
      addBot(`<b>Outstanding Receivables</b> — ${out.length} invoice(s)<table><thead><tr><th>Txn</th><th>Client</th><th class="num">Balance</th></tr></thead>
        <tbody>${out.map(r => `<tr><td class="mono">${r.txn}</td><td>${r.client||"—"}</td><td class="num mono">${fmtn(r.amount-r.settled_amount)}</td></tr>`).join("") || `<tr><td colspan="3">All clear 🎉</td></tr>`}</tbody></table>`);
      backChip();
      return;
    }
    if (/payable|vendor.*due/.test(lower)) {
      const rows = await api("GET", "/api/payables");
      const out = rows.filter(r => (r.amount - r.settled_amount) > 0.005);
      addBot(`<b>Outstanding Payables</b> — ${out.length} bill(s)<table><thead><tr><th>Bill #</th><th>Vendor</th><th class="num">Balance</th></tr></thead>
        <tbody>${out.map(r => `<tr><td class="mono">${r.bill_no}</td><td>${r.vendor||"—"}</td><td class="num mono">${fmtn(r.amount-r.settled_amount)}</td></tr>`).join("") || `<tr><td colspan="3">All clear 🎉</td></tr>`}</tbody></table>`);
      backChip();
      return;
    }
    if (/container/.test(lower)) {
      const rows = await api("GET", "/api/reports/job-containers");
      addBot(`<b>Job Containers</b> — ${rows.length}<table><thead><tr><th>Job #</th><th>Container #</th><th>Size</th></tr></thead>
        <tbody>${rows.slice(0,30).map(r=>`<tr><td class="mono">${r.job_no}</td><td class="mono">${r.no}</td><td>${r.size}</td></tr>`).join("")||`<tr><td colspan="3">No data.</td></tr>`}</tbody></table>`);
      backChip();
      return;
    }
    if (/\bbl\b|release/.test(lower)) { addBot(`BL Release Status:`); const rows = await api("GET", "/api/reports/bl-release-status");
      addBot(`<table><thead><tr><th>Job #</th><th>Client</th><th>Status</th></tr></thead><tbody>${rows.slice(0,30).map(r=>`<tr><td class="mono">${r.job_no}</td><td>${r.client||"—"}</td><td>${r.release_status||"—"}</td></tr>`).join("")||`<tr><td colspan="3">No data.</td></tr>`}</tbody></table>`);
      backChip(); return; }
    if (/profit|p&l|p and l/.test(lower)) {
      const rows = await api("GET", "/api/reports/job-pl");
      addBot(`<b>Job P&amp;L</b><table><thead><tr><th>Job #</th><th>Client</th><th class="num">Profit</th></tr></thead>
        <tbody>${rows.slice(0,30).map(r=>`<tr><td class="mono">${r.job_no}</td><td>${r.client||"—"}</td><td class="num mono">${fmtn(r.profit)}</td></tr>`).join("")||`<tr><td colspan="3">No data.</td></tr>`}</tbody></table>`);
      backChip();
      return;
    }
    if (/stat|summary|dashboard/.test(lower)) { showAdminSnapshot(); return; }
    if (/job/.test(lower) && jobs.length) { addBot(`Job List:`); addBot(jobsTable(jobs)); backChip(); return; }

    // Nothing matched exactly — try a looser word-overlap match across every known name before giving
    // up, and if a few plausible names come up, ask which one instead of just failing silently.
    const words = lower.split(/\s+/).filter(w => w.length >= 3);
    const allEntities = [
      ...clientNames.map(n => ({ name: n, kind: "client" })),
      ...vendorNames.map(n => ({ name: n, kind: "vendor" })),
      ...vessels.map(v => ({ name: v.name, kind: "vessel", obj: v })),
      ...ports.map(p => ({ name: p.name, kind: "port" })),
    ];
    const candidates = allEntities.filter(e => {
      const nameWords = e.name.toLowerCase().split(/\s+/);
      return words.some(w => nameWords.some(nw => nw.startsWith(w) || w.startsWith(nw)));
    });
    const uniqueCandidates = [...new Map(candidates.map(c => [c.kind + ":" + c.name, c])).values()].slice(0, 5);

    if (uniqueCandidates.length === 1) {
      const c = uniqueCandidates[0];
      addBot(`I think you mean <b>${c.name}</b> (${c.kind}) — here's what I have:`);
      if (c.kind === "client") await runClientReport(c.name);
      else if (c.kind === "vendor") { await handleFreeText(c.name); }
      else if (c.kind === "vessel") await runVesselReport(c.obj, null);
      else if (c.kind === "port") await runPortReport("pol", c.name);
      return;
    }
    if (uniqueCandidates.length > 1) {
      addBot(`I'm not 100% sure which one you mean — did you mean one of these?`);
      addChips(uniqueCandidates.map(c => [`${c.name} (${c.kind})`, () => {
        clearChips();
        addUser(c.name);
        handleFreeText(c.name);
      }]));
      return;
    }

    addBot(`🤔 I didn't quite catch that — I couldn't find a matching client, vendor, vessel, or port for "${esc(text)}". I'm a guided assistant (not a general AI), so I only recognize known names and keywords like "outstanding", "payable", "container", "bl", or "profit". Pick an option below, or try typing just the name on its own:`);
    showMainMenu();
  });
}

document.getElementById("chatSend").onclick = () => {
  const inp = document.getElementById("chatInput");
  const text = inp.value.trim();
  if (!text) return;
  clearChips();
  addUser(text);
  inp.value = "";
  handleFreeText(text);
};
document.getElementById("chatInput").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("chatSend").click(); });
document.getElementById("chatMenuBtn").onclick = () => { clearChips(); showMainMenu(); };

(async function init() {
  await renderTopNav("chatbot.html");
  showMainMenu();
})();
</script>
</body>
</html>
