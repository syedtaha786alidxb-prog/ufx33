<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Dashboard — Harbor Desk</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .group-title{font-size:13px;font-weight:700;color:var(--text-mute);text-transform:uppercase;letter-spacing:.4px;margin:22px 0 10px 0;}
  .group-title:first-child{margin-top:0;}
  .tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;text-decoration:none;color:var(--text);
    transition:border-color .12s ease, transform .12s ease;display:block;}
  .tile:hover{border-color:var(--orange);transform:translateY(-2px);}
  .tile .icon{font-size:22px;margin-bottom:8px;display:block;}
  .tile .title{font-weight:700;font-size:14px;margin-bottom:4px;}
  .tile .desc{font-size:12px;color:var(--text-mute);}
  .welcome{font-size:20px;margin:0 0 4px 0;}
</style>
</head>
<body>
<div class="topnav" id="topnav"></div>
<div class="wrap">
  <div class="panel">
    <h1 class="welcome" id="welcomeMsg">Welcome</h1>
    <p class="sub">Pick a module below to get started.</p>
  </div>
  <div id="tileArea"></div>
</div>
<script src="/js/api.js"></script>
<script>
const GROUPS = [
  { key:"job", title:"Sea Export / Import Job", tiles:[
    { href:"job/booking.html", icon:"📋", title:"Booking Info", desc:"Job, Equipment & Charges — all in one place" },
    { href:"job/bl.html", icon:"🚢", title:"B/L & Containers", desc:"HBL and container nos." },
    { href:"job/invoice.html", icon:"🧾", title:"Invoice", desc:"Generate & download" },
    { href:"job/jobbill.html", icon:"💵", title:"Job Bill", desc:"Vendor bills for this job — find & pay" },
    { href:"job/joblist.html", icon:"📑", title:"Job List", desc:"All jobs created" },
  ]},
  { key:"accounting", title:"Accounting", tiles:[
    { href:"accounting/coa.html", icon:"📊", title:"Chart of Accounts", desc:"GL account list" },
    { href:"accounting/vouchers.html", icon:"📝", title:"Journal Vouchers", desc:"Manual entries" },
    { href:"accounting/ledger.html", icon:"📒", title:"Ledger", desc:"Per-account activity" },
    { href:"accounting/receivables.html", icon:"⬇️", title:"Receivables", desc:"Customer invoices & receipts" },
    { href:"accounting/payables.html", icon:"⬆️", title:"Payables", desc:"Vendor bills & payments" },
    { href:"accounting/trialbalance.html", icon:"⚖️", title:"Trial Balance", desc:"Debit / credit summary" },
    { href:"admin/charge-codes.html", icon:"🏷️", title:"Charge Codes", desc:"Link charges to GL accounts" },
  ]},
  { key:"admin", title:"Admin", tiles:[
    { href:"admin/vessels.html", icon:"🚢", title:"Vessels & Voyages", desc:"Vessel master, multiple voyages" },
    { href:"admin/parties.html", icon:"👥", title:"Customers & Vendors", desc:"Party master list" },
    { href:"admin/commodities.html", icon:"📦", title:"Commodities", desc:"Commodity master list" },
    { href:"admin/ports.html", icon:"⚓", title:"Ports", desc:"Worldwide port master" },
    { href:"admin/users.html", icon:"🔑", title:"Users & Access", desc:"Accounts & permissions" },
    { href:"admin/settings.html", icon:"⚙️", title:"Settings", desc:"Financial year & SMTP" },
    { href:"admin/logs.html", icon:"🗒️", title:"Logs", desc:"Activity & email history" },
  ]},
  { key:"reports", title:"Reports", tiles:[
    { href:"reports/index.html", icon:"📈", title:"Reports", desc:"All standard & live reports" },
    { href:"reports/edi.html", icon:"📤", title:"EDI Export / Import", desc:"PEDI manifest format" },
  ]},
];

(async function init() {
  await renderTopNav("dashboard.html");
  let me;
  try { me = await (await fetch("/api/me")).json(); } catch (e) { window.location.href = "/login.html"; return; }
  document.getElementById("welcomeMsg").textContent = `Welcome, ${me.name}`;

  const allowedGroups = GROUPS.filter(g => me.modules.includes(g.key));
  document.getElementById("tileArea").innerHTML = allowedGroups.map(g => `
    <div class="group-title">${g.title}</div>
    <div class="tile-grid">
      ${g.tiles.map(t => `
        <a class="tile" href="/${t.href}">
          <span class="icon">${t.icon}</span>
          <div class="title">${t.title}</div>
          <div class="desc">${t.desc}</div>
        </a>`).join("")}
    </div>`).join("") || `<div class="empty">No modules assigned to your account yet — ask an admin to grant access.</div>`;
})();
</script>
</body>
</html>
